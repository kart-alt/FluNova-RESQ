<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ONNX Speed Test - WASM</title>
</head>
<body style="background:#111; color:#eee; font-family:monospace; padding:20px;">
  <h2>ONNX WASM Test</h2>
  <div id="status" style="font-size:18px; margin-bottom:15px; color:#ffb703;">Loading...</div>
  <pre id="log" style="background:#1a1a1a; padding:15px; border-radius:8px; border:1px solid #333; line-height:1.5;"></pre>

  <script type="module">
    import * as ort from '/onnx/ort.all.bundle.min.mjs';

    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const log = (msg) => { logEl.textContent += msg + '\n'; console.log(msg); };

    async function run() {
      try {
        log('Starting WASM inference test...');
        log('crossOriginIsolated: ' + (typeof crossOriginIsolated !== 'undefined' ? crossOriginIsolated : false));
        log('SharedArrayBuffer: ' + (typeof SharedArrayBuffer !== 'undefined'));
        log('Hardware concurrency: ' + navigator.hardwareConcurrency);

        ort.env.wasm.wasmPaths = '/onnx/';
        if (typeof crossOriginIsolated !== 'undefined' && crossOriginIsolated) {
          ort.env.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 2);
        } else {
          ort.env.wasm.numThreads = 1;
        }
        log('Configured numThreads: ' + ort.env.wasm.numThreads);

        const t0 = performance.now();
        const resp = await fetch('/models/yolov8n-pose.onnx');
        const buf = await resp.arrayBuffer();
        log(`Model fetched (${(buf.byteLength/1024/1024).toFixed(1)}MB) in ${(performance.now() - t0).toFixed(0)}ms`);

        const tSession = performance.now();
        const session = await ort.InferenceSession.create(new Uint8Array(buf), {
          executionProviders: ['wasm'],
          graphOptimizationLevel: 'all'
        });
        log(`Session created with ['wasm'] in ${(performance.now() - tSession).toFixed(0)}ms`);

        const inputTensor = new ort.Tensor('float32', new Float32Array(3 * 320 * 320), [1, 3, 320, 320]);
        
        // Warmup
        statusEl.textContent = 'Warming up...';
        const tWarmup = performance.now();
        await session.run({ [session.inputNames[0]]: inputTensor });
        log(`Warmup completed in ${(performance.now() - tWarmup).toFixed(0)}ms`);

        // 3 runs
        const times = [];
        for (let i = 0; i < 3; i++) {
          const tRun = performance.now();
          await session.run({ [session.inputNames[0]]: inputTensor });
          const dt = performance.now() - tRun;
          times.push(dt);
          log(`Iter ${i+1}: ${dt.toFixed(1)}ms`);
        }

        const avg = times.reduce((a, b) => a + b, 0) / times.length;
        const msg = `WASM Average: ${avg.toFixed(1)}ms (${(1000/avg).toFixed(1)} FPS)`;
        log('\n' + msg);
        statusEl.innerHTML = `<span style="color:#00ff88; font-weight:bold;">${msg}</span>`;
      } catch (e) {
        log('ERROR: ' + (e.stack || e.message));
        statusEl.innerHTML = `<span style="color:red;">Error: ${e.message}</span>`;
      }
    }

    run();
  </script>
</body>
</html>
